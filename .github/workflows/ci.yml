name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - name: Install (locked)
        run: uv sync --locked --extra faiss
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Shell scripts (errors only)
        run: shellcheck -S error scripts/*.sh infrastructure/cluster/*.sh infrastructure/cluster/*.sbatch
      - name: Cluster submission (dry run, no SLURM needed)
        run: ELEVATE_ROOT="$RUNNER_TEMP/elevate" DRY_RUN=1 infrastructure/cluster/submit.sh smoke
      - name: Tests (offline; DB-service tests skip without services)
        run: uv run pytest -q --cov=elevate_rag --cov-report=term --cov-fail-under=80

  docker-image:
    # Builds the deployment image and runs the offline demo inside it. Nothing is pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t elevate-rag:ci .
      - name: Smoke test (offline demo, no network)
        run: docker run --rm --network none elevate-rag:ci demo --out /data/demo
