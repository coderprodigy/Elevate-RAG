name: Quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra graph --extra router --extra faiss --extra community --extra report --extra evaluation --extra schema --extra datasets --extra tracing
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest --cov=elevate_rag --cov-report=term-missing
