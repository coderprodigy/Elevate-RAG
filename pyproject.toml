[project]
name = "hgrag"
version = "0.1.0"
description = "Hybrid vector + graph RAG with a learned query router (ECE 750 group project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "bm25s>=0.3.16",
    "faiss-cpu>=1.16.0",
    "huggingface-hub>=2.4.0",
    "lightrag-hku>=1.5.8",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openai",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pystemmer>=3.1.0",
    "python-dotenv",
    "pyyaml",
    "rapidfuzz>=3.14.6",
    "rich",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
    "typer",
]

[project.scripts]
hgrag = "hgrag.cli:app"

[dependency-groups]
bench = [
    "neo4j>=6.4.1",
    "psycopg[binary]>=3.3.9",
    "pymilvus>=3.0.3",
    "qdrant-client>=1.20.0",
]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hgrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "bm25s", "bm25s.*", "Stemmer", "lightrag", "lightrag.*", "networkx", "networkx.*", "sklearn", "sklearn.*", "matplotlib", "matplotlib.*", "qdrant_client", "qdrant_client.*", "pymilvus", "pymilvus.*", "psycopg", "psycopg.*", "neo4j", "neo4j.*"]  # no type stubs
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs network, API keys, Docker or the server tunnel",
]
