# Qdrant vector database (Requirement 2.4, 26.3).
# Usage: docker compose -f docker/qdrant.yml --env-file .env up -d
# Client settings: QDRANT_URL=http://localhost:6333, QDRANT_API_KEY.
# Every DB stack shares the same CPU/memory limits (ELEVATE_DB_CPUS / ELEVATE_DB_MEMORY).
name: elevate-qdrant

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change-me}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl; probe the HTTP port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${ELEVATE_DB_CPUS:-2}"
          memory: ${ELEVATE_DB_MEMORY:-4g}

volumes:
  qdrant_data:
