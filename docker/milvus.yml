# Milvus standalone vector database (Requirement 2.4, 26.3).
# Usage: docker compose -f docker/milvus.yml --env-file .env up -d
# Client settings: MILVUS_URI=http://localhost:19530, MILVUS_TOKEN=root:Milvus.
# The benchmarked `milvus` service gets the shared DB limits (ELEVATE_DB_CPUS / ELEVATE_DB_MEMORY).
# etcd and MinIO are Milvus's required metadata and object stores; they get small, fixed
# limits of their own (ELEVATE_DB_AUX_CPUS / ELEVATE_DB_AUX_MEMORY) and are reported as overhead.
name: elevate-milvus

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "${ELEVATE_DB_AUX_CPUS:-0.5}"
          memory: ${ELEVATE_DB_AUX_MEMORY:-512m}

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "${ELEVATE_DB_AUX_CPUS:-0.5}"
          memory: ${ELEVATE_DB_AUX_MEMORY:-512m}

  milvus:
    image: milvusdb/milvus:v2.5.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "${ELEVATE_DB_CPUS:-2}"
          memory: ${ELEVATE_DB_MEMORY:-4g}

volumes:
  milvus_etcd:
  milvus_minio:
  milvus_data:
