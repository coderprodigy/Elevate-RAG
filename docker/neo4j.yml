# Neo4j graph database (Requirement 2.4, 26.3).
# Usage: docker compose -f docker/neo4j.yml --env-file .env up -d
# Client settings: NEO4J_URI=bolt://localhost:7687, NEO4J_USER=neo4j, NEO4J_PASSWORD.
# Neo4j requires a password of at least 8 characters. Its user name is fixed to `neo4j` here.
name: elevate-neo4j

services:
  neo4j:
    image: neo4j:5.26.2-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me}
      # Heap + page cache sized to stay inside the shared 4g container limit.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1500m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1500m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1500m}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u "$${NEO4J_AUTH%%/*}" -p "$${NEO4J_AUTH#*/}" 'RETURN 1' || exit 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${ELEVATE_DB_CPUS:-2}"
          memory: ${ELEVATE_DB_MEMORY:-4g}

volumes:
  neo4j_data:
  neo4j_logs:
