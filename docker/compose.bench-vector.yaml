# Extra vector stores for E4 Level A/B. One profile at a time on a laptop.
x-limits: &limits
  deploy:
    resources:
      limits: {cpus: "${HGRAG_DB_CPUS:-4}", memory: "${HGRAG_DB_MEM:-4g}"}

services:
  milvus-etcd:
    profiles: [milvus]
    image: quay.io/coreos/etcd:v3.5.16
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment: {ETCD_AUTO_COMPACTION_MODE: revision, ETCD_AUTO_COMPACTION_RETENTION: "1000"}
  milvus-minio:
    profiles: [milvus]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment: {MINIO_ACCESS_KEY: minioadmin, MINIO_SECRET_KEY: minioadmin}
  milvus:
    profiles: [milvus]
    image: milvusdb/milvus:v2.4.15
    container_name: hgrag-milvus
    command: ["milvus", "run", "standalone"]
    environment: {ETCD_ENDPOINTS: "milvus-etcd:2379", MINIO_ADDRESS: "milvus-minio:9000"}
    ports: ["127.0.0.1:19530:19530"]
    depends_on: [milvus-etcd, milvus-minio]
    <<: *limits
  pgvector:
    profiles: [pgvector]
    image: pgvector/pgvector:pg16
    container_name: hgrag-pgvector
    environment:
      POSTGRES_USER: hgrag
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hgrag-dev-password}"
      POSTGRES_DB: hgrag
    ports: ["127.0.0.1:5432:5432"]
    <<: *limits
