# Set the exact version installed in the dedicated framework virtual environment.
framework_version = "0.14.26"
chat_url = "http://127.0.0.1:8080/v1"
chat_model = "replace-with-local-frozen-chat-model"
embedding_url = "http://127.0.0.1:8081/v1"
embedding_model = "replace-with-local-frozen-embedding-model"
